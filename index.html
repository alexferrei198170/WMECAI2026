<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Otimização da Destinação da Produção Citrícola</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f2f4f7;
            font-family:'Segoe UI', Arial, sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:1600px;
        }

        .card{
            background:#ffffff;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 35px rgba(0,0,0,0.15);
        }

        .card img{
            width:100%;
            height:auto;
            display:block;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <img
                src="apresentação Otimização Citrícola com Programação Linear.png"
                alt="Otimização da Destinação da Produção Citrícola">

        </div>

    </div>

</body>

</html>
